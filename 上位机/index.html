<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101419" />
    <script>
      (() => {
        try {
          const Saved_theme = window.localStorage.getItem("foc-theme");
          const Theme = Saved_theme === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = Theme;
          document.documentElement.style.colorScheme = Theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", Theme === "light" ? "#edf1f4" : "#101419");
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <title>FOC_L</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
